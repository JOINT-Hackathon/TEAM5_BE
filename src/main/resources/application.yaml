spring:
  application:
    name: MayDay
  datasource:
    url: jdbc:h2:mem:mayday;MODE=MySQL
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# API 키는 절대 이 파일에 직접 쓰지 말고 환경변수 GEMINI_API_KEY 로 넣기
gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-3.8-flash}
  base-url: https://generativelanguage.googleapis.com/v1beta
  temperature: 0.4
